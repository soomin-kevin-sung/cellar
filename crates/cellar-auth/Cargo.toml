[package]
name = "cellar-auth"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "=0.1.91"
base64 = "=0.22.1"
cellar-config = { path = "../cellar-config" }
getrandom = "=0.3.4"
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["rust_crypto"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tokio = { version = "=1.53.1", features = ["io-util", "rt", "sync", "time"] }
url = "=2.5.8"

[dev-dependencies]
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["rust_crypto", "use_pem"] }
rsa = { version = "=0.9.10", features = ["pem"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
