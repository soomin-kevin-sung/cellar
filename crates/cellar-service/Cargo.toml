[package]
name = "cellar-service"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
async-trait = "0.1.89"
cellar-api = { path = "../cellar-api" }
cellar-auth = { path = "../cellar-auth" }
cellar-config = { path = "../cellar-config" }
cellar-core = { path = "../cellar-core" }
cellar-db = { path = "../cellar-db" }
cellar-windows = { path = "../cellar-windows" }
rcgen = { version = "0.14.8", features = ["x509-parser", "zeroize"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls-no-provider", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
socket2 = "0.6.2"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
time = "0.3.54"
tokio.workspace = true
tokio-util = { version = "0.7.19", features = ["io"] }
futures-util = "0.3.33"
url = "2.5.8"
x509-parser = { version = "0.18.1", features = ["verify"] }
zeroize = "1.9.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_EventLog",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3.27.0"
time = "0.3.54"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.4"
x509-parser = { version = "0.18.1", features = ["verify"] }
